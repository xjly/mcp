[project]
name = "knowledge-mcp-server"
version = "0.1.0"
description = "Read-only MCP access to a shared Wuxi document knowledge base"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29,<1",
    "httpx>=0.28,<1",
    "mcp>=1.27,<2",
    "pydantic>=2,<3",
    "pymilvus>=2.5.8,<2.6",
]

[project.scripts]
knowledge-mcp = "knowledge_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp"]
